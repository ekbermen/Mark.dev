name: MarkDev APK

# Nasil baslar?
#  1) GitHub > Actions > "MarkDev APK" > Run workflow butonu
#  2) Herhangi bir Issue'ya "basla" yazip yorum atarsan (sadece repo sahibi/ortaklar)
#  3) Bu dosyayi her guncelledigin (push) zaman otomatik
# ONEMLI: dosya yolu tam olarak  .github/workflows/MarkDev.yml  olmali (kok dizinde calismaz)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/MarkDev.yml']
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: markdev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'issue_comment' ||
      (contains(github.event.comment.body, 'basla') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Proje olustur
        run: |
          flutter create --org dev.mark --project-name mark_dev --platforms android app
          cd app
          flutter pub add http shared_preferences path_provider
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="mark_dev"#android:label="Mark.Dev"#' android/app/src/main/AndroidManifest.xml
      - name: Logo / uygulama ikonu ciz
        continue-on-error: true
        run: |
          python3 -m venv /tmp/v
          /tmp/v/bin/pip install --quiet pillow
          /tmp/v/bin/python - <<'PY'
          import os
          from PIL import Image, ImageDraw
          
          S = 1024
          TEAL = (0, 229, 200, 255)
          
          top = Image.new('RGB', (S, S), (94, 53, 177))
          bot = Image.new('RGB', (S, S), (13, 27, 62))
          mask = Image.linear_gradient('L').resize((S, S))
          bg = Image.composite(bot, top, mask).convert('RGBA')
          
          d = ImageDraw.Draw(bg)
          pts = [(250, 740), (250, 290), (512, 560), (774, 290), (774, 740)]
          d.line(pts, fill=(255, 255, 255, 255), width=90, joint='curve')
          for x, y in (pts[0], pts[-1], pts[1], pts[-2]):
              d.ellipse((x - 45, y - 45, x + 45, y + 45), fill=(255, 255, 255, 255))
          d.ellipse((774 - 50, 250 - 50, 774 + 50, 250 + 50), fill=TEAL)
          d.rounded_rectangle((372, 810, 652, 850), radius=20, fill=TEAL)
          
          rm = Image.new('L', (S, S), 0)
          ImageDraw.Draw(rm).rounded_rectangle((0, 0, S - 1, S - 1), radius=230, fill=255)
          out = Image.new('RGBA', (S, S), (0, 0, 0, 0))
          out.paste(bg, (0, 0), rm)
          
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for name, px in sizes.items():
              p = f'app/android/app/src/main/res/mipmap-{name}'
              os.makedirs(p, exist_ok=True)
              out.resize((px, px), Image.LANCZOS).save(f'{p}/ic_launcher.png')
          out.resize((512, 512), Image.LANCZOS).save('mark_logo_512.png')
          print('ikonlar hazir')
          PY
      - name: Kod yaz
        run: |
          cat > app/lib/main.dart <<'EOF'
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:http/http.dart' as http;
          import 'package:path_provider/path_provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          
          late SharedPreferences sp;
          const teal = Color(0xFF00E5C8);
          const mono = TextStyle(fontFamily: 'monospace', fontSize: 12);
          
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            sp = await SharedPreferences.getInstance();
            runApp(MaterialApp(
              title: 'Mark.Dev',
              debugShowCheckedModeBanner: false,
              theme: ThemeData.dark(useMaterial3: true).copyWith(
                colorScheme: ColorScheme.fromSeed(seedColor: Colors.deepPurple, brightness: Brightness.dark),
                scaffoldBackgroundColor: const Color(0xFF0B0B14),
              ),
              home: const Splash(),
            ));
          }
          
          // ---------- LOGO ----------
          class LogoPainter extends CustomPainter {
            @override
            void paint(Canvas c, Size s) {
              final k = s.width / 1024;
              final rect = Offset.zero & s;
              c.drawRRect(
                RRect.fromRectAndRadius(rect, Radius.circular(230 * k)),
                Paint()
                  ..shader = const LinearGradient(
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                    colors: [Color(0xFF5E35B1), Color(0xFF0D1B3E)],
                  ).createShader(rect),
              );
              final m = Path()
                ..moveTo(250 * k, 740 * k)
                ..lineTo(250 * k, 290 * k)
                ..lineTo(512 * k, 560 * k)
                ..lineTo(774 * k, 290 * k)
                ..lineTo(774 * k, 740 * k);
              c.drawPath(
                m,
                Paint()
                  ..color = Colors.white
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 90 * k
                  ..strokeCap = StrokeCap.round
                  ..strokeJoin = StrokeJoin.round,
              );
              c.drawCircle(Offset(774 * k, 250 * k), 50 * k, Paint()..color = teal);
              c.drawRRect(
                RRect.fromRectAndRadius(Rect.fromLTWH(372 * k, 810 * k, 280 * k, 40 * k), Radius.circular(20 * k)),
                Paint()..color = teal,
              );
            }
          
            @override
            bool shouldRepaint(covariant CustomPainter old) => false;
          }
          
          class MarkLogo extends StatelessWidget {
            final double size;
            const MarkLogo({super.key, this.size = 96});
            @override
            Widget build(BuildContext context) => Container(
                  width: size,
                  height: size,
                  decoration: BoxDecoration(
                    borderRadius: BorderRadius.circular(size * 0.23),
                    boxShadow: [BoxShadow(color: teal.withAlpha(60), blurRadius: size * 0.3, spreadRadius: 1)],
                  ),
                  child: CustomPaint(painter: LogoPainter()),
                );
          }
          
          class Splash extends StatefulWidget {
            const Splash({super.key});
            @override
            State<Splash> createState() => _SplashS();
          }
          
          class _SplashS extends State<Splash> {
            @override
            void initState() {
              super.initState();
              Future.delayed(const Duration(milliseconds: 1900), () {
                if (!mounted) return;
                Navigator.of(context).pushReplacement(PageRouteBuilder(
                  transitionDuration: const Duration(milliseconds: 500),
                  pageBuilder: (_, __, ___) => const Home(),
                  transitionsBuilder: (_, a, __, child) => FadeTransition(opacity: a, child: child),
                ));
              });
            }
          
            @override
            Widget build(BuildContext context) => Scaffold(
                  body: Center(
                    child: TweenAnimationBuilder<double>(
                      tween: Tween<double>(begin: 0.0, end: 1.0),
                      duration: const Duration(milliseconds: 1100),
                      curve: Curves.easeOutBack,
                      builder: (c, v, _) => Opacity(
                        opacity: v.clamp(0.0, 1.0).toDouble(),
                        child: Transform.scale(
                          scale: 0.6 + 0.4 * v,
                          child: const Column(mainAxisSize: MainAxisSize.min, children: [
                            MarkLogo(size: 132),
                            SizedBox(height: 22),
                            Text('Mark.Dev', style: TextStyle(fontSize: 30, fontWeight: FontWeight.w800, letterSpacing: 1.5)),
                            SizedBox(height: 6),
                            Text('30 kisilik yapay zeka yazilim ekibi', style: TextStyle(color: Colors.white54)),
                          ]),
                        ),
                      ),
                    ),
                  ),
                );
          }
          
          // ---------- VERI ----------
          const presets = {
            'Groq': ['https://api.groq.com/openai/v1', 'llama-3.3-70b-versatile'],
            'OpenRouter': ['https://openrouter.ai/api/v1', 'openai/gpt-4o-mini'],
            'Gemini': ['https://generativelanguage.googleapis.com/v1beta/openai', 'gemini-2.0-flash'],
            'OpenAI': ['https://api.openai.com/v1', 'gpt-4o-mini'],
            'Ozel': ['', ''],
          };
          
          class W {
            final String n, r;
            final int t;
            const W(this.n, this.r, this.t);
          }
          
          List<W> mk(String s, int t) => s.split(',').map((e) => W(e.split(':')[0], e.split(':')[1], t)).toList();
          final workers = [
            ...mk('Mark:Bas Muhendis,Alex:Mimar,Leyla:Algoritma,Deniz:Guvenlik,Kaan:Backend,Ece:Derleme-CI,Arda:Veritabani,Selin:Hata Ayiklama,Can:Sistem,Zeynep:Arastirma', 0),
            ...mk('Berk:Frontend,Ayse:UI-UX,Tolga:Mobil,Nehir:Test,Emre:API Entegrasyon,Isil:Dokuman,Onur:Oyun,Defne:Veri,Baris:Otomasyon,Melis:Optimizasyon', 1),
            ...mk('Tokena:Token Hesabi,Ali:Sohbet,Su:Hizli Yanit,Eda:Ceviri,Cem:Ozet,Pelin:Fikir,Yigit:Sohbet,Naz:Hizli Yanit,Orhan:Ozet,Mira:Sohbet', 2),
          ];
          const tierColors = [Colors.deepPurple, Colors.teal, Colors.orange];
          
          class Api {
            String p, url, model, key;
            Api(this.p, this.url, this.model, this.key);
            factory Api.empty() => Api('Groq', presets['Groq']![0], presets['Groq']![1], '');
            Map toJson() => {'p': p, 'url': url, 'model': model, 'key': key};
            factory Api.fromJson(Map j) => Api(j['p'], j['url'], j['model'], j['key']);
          }
          
          class Msg {
            String role, text, w;
            Msg(this.role, this.text, [this.w = '']);
            Map toJson() => {'r': role, 't': text, 'w': w};
            factory Msg.fromJson(Map j) => Msg(j['r'], j['t'], j['w']);
          }
          
          class Chat {
            String id, title, mode;
            List<Api> apis;
            List<bool> ex;
            List<Msg> msgs;
            Chat(this.id, this.title, this.mode, this.apis, this.ex, this.msgs);
            Map toJson() => {'id': id, 'title': title, 'mode': mode, 'apis': apis.map((a) => a.toJson()).toList(), 'ex': ex, 'msgs': msgs.map((m) => m.toJson()).toList()};
            factory Chat.fromJson(Map j) => Chat(j['id'], j['title'], j['mode'], (j['apis'] as List).map((e) => Api.fromJson(e)).toList(), (j['ex'] as List).cast<bool>().toList(), (j['msgs'] as List).map((e) => Msg.fromJson(e)).toList());
          }
          
          List<Chat> loadChats() => (jsonDecode(sp.getString('chats') ?? '[]') as List).map((e) => Chat.fromJson(e)).toList();
          void saveChats(List<Chat> c) => sp.setString('chats', jsonEncode(c.map((e) => e.toJson()).toList()));
          
          class Exhausted implements Exception {
            final int code;
            Exhausted(this.code);
          }
          
          // ---------- AG ----------
          Future<String> ask(Api a, List msgs) async {
            final r = await http
                .post(Uri.parse('${a.url}/chat/completions'),
                    headers: {'Authorization': 'Bearer ${a.key}', 'Content-Type': 'application/json'},
                    body: jsonEncode({'model': a.model, 'messages': msgs}))
                .timeout(const Duration(seconds: 120));
            if ([401, 402, 403, 429].contains(r.statusCode)) throw Exhausted(r.statusCode);
            if (r.statusCode != 200) throw Exception('HTTP ${r.statusCode}: ${r.body}');
            return jsonDecode(utf8.decode(r.bodyBytes))['choices'][0]['message']['content'];
          }
          
          Future<String> ghPush(String tok, String repo, String path, String content) async {
            final u = Uri.parse('https://api.github.com/repos/$repo/contents/$path');
            final h = {'Authorization': 'Bearer $tok', 'Accept': 'application/vnd.github+json'};
            final g = await http.get(u, headers: h);
            final sha = g.statusCode == 200 ? jsonDecode(g.body)['sha'] : null;
            final p = await http.put(u, headers: h, body: jsonEncode({'message': 'Mark.Dev: $path', 'content': base64Encode(utf8.encode(content)), if (sha != null) 'sha': sha}));
            return p.statusCode < 300 ? 'GitHub: gonderildi' : 'GitHub hata ${p.statusCode}';
          }
          
          Future<String> ghRun(String tok, String repo, String wf) async {
            final h = {'Authorization': 'Bearer $tok', 'Accept': 'application/vnd.github+json'};
            final g = await http.get(Uri.parse('https://api.github.com/repos/$repo'), headers: h);
            if (g.statusCode != 200) return 'Repo okunamadi (HTTP ${g.statusCode})';
            final br = jsonDecode(g.body)['default_branch'];
            final p = await http.post(Uri.parse('https://api.github.com/repos/$repo/actions/workflows/$wf/dispatches'), headers: h, body: jsonEncode({'ref': br}));
            if (p.statusCode == 204) return 'Workflow baslatildi! GitHub > Actions sekmesine bak';
            return 'Baslatilamadi (HTTP ${p.statusCode}). Token icin workflow yetkisi lazim, dosya da once GitHub a gonderilmis olmali.';
          }
          
          Future<Api?> editApi(BuildContext c, Api a) async {
            var p = a.p;
            final u = TextEditingController(text: a.url), m = TextEditingController(text: a.model), k = TextEditingController(text: a.key);
            return showDialog<Api>(
                context: c,
                builder: (_) => StatefulBuilder(
                    builder: (ctx, ss) => AlertDialog(
                          title: const Text('API'),
                          content: SingleChildScrollView(
                              child: Column(mainAxisSize: MainAxisSize.min, children: [
                            DropdownButton<String>(
                                value: p,
                                isExpanded: true,
                                items: presets.keys.map((e) => DropdownMenuItem(value: e, child: Text(e))).toList(),
                                onChanged: (v) => ss(() {
                                      p = v!;
                                      if (presets[p]![0].isNotEmpty) {
                                        u.text = presets[p]![0];
                                        m.text = presets[p]![1];
                                      }
                                    })),
                            TextField(controller: u, decoration: const InputDecoration(labelText: 'Base URL (OpenAI uyumlu)')),
                            TextField(controller: m, decoration: const InputDecoration(labelText: 'Model')),
                            TextField(controller: k, decoration: const InputDecoration(labelText: 'API Key')),
                          ])),
                          actions: [TextButton(onPressed: () => Navigator.pop(ctx, Api(p, u.text.trim(), m.text.trim(), k.text.trim())), child: const Text('Kaydet'))],
                        )));
          }
          
          // ---------- ANA EKRAN ----------
          class Home extends StatefulWidget {
            const Home({super.key});
            @override
            State<Home> createState() => _HomeS();
          }
          
          class _HomeS extends State<Home> {
            List<Chat> chats = loadChats();
          
            Future<void> newChat() async {
              final mode = await showDialog<String>(
                  context: context,
                  builder: (c) => SimpleDialog(title: const Text('Mark modu'), children: [
                        SimpleDialogOption(onPressed: () => Navigator.pop(c, 'Sohbet'), child: const Text('Mark Sohbet')),
                        SimpleDialogOption(onPressed: () => Navigator.pop(c, 'Kod'), child: const Text('Mark Kod')),
                      ]));
              if (mode == null || !mounted) return;
              final ch = await Navigator.push<Chat>(context, MaterialPageRoute(builder: (_) => Setup(mode, chats.isEmpty ? null : chats.last)));
              if (ch == null || !mounted) return;
              chats.add(ch);
              saveChats(chats);
              await Navigator.push(context, MaterialPageRoute(builder: (_) => ChatPage(ch, chats)));
              setState(() {});
            }
          
            Future<void> rename(Chat c) async {
              final t = TextEditingController(text: c.title);
              final r = await showDialog<String>(
                  context: context,
                  builder: (d) => AlertDialog(
                        title: const Text('Yeniden adlandir'),
                        content: TextField(controller: t, autofocus: true),
                        actions: [
                          TextButton(onPressed: () => Navigator.pop(d), child: const Text('Vazgec')),
                          TextButton(onPressed: () => Navigator.pop(d, t.text.trim()), child: const Text('Kaydet')),
                        ],
                      ));
              if (r != null && r.isNotEmpty) {
                setState(() => c.title = r);
                saveChats(chats);
              }
            }
          
            Future<void> del(Chat c) async {
              final ok = await showDialog<bool>(
                  context: context,
                  builder: (d) => AlertDialog(
                        title: const Text('Sohbet silinsin mi?'),
                        content: Text(c.title),
                        actions: [
                          TextButton(onPressed: () => Navigator.pop(d, false), child: const Text('Vazgec')),
                          TextButton(onPressed: () => Navigator.pop(d, true), child: const Text('Sil')),
                        ],
                      ));
              if (ok == true) {
                setState(() => chats.remove(c));
                saveChats(chats);
              }
            }
          
            Future<void> gh() async {
              final t = TextEditingController(text: sp.getString('ght') ?? ''), r = TextEditingController(text: sp.getString('ghr') ?? '');
              await showDialog(
                  context: context,
                  builder: (c) => AlertDialog(
                        title: const Text('GitHub hesabi'),
                        content: Column(mainAxisSize: MainAxisSize.min, children: [
                          TextField(controller: t, obscureText: true, decoration: const InputDecoration(labelText: 'Token (repo + workflow yetkili)')),
                          TextField(controller: r, decoration: const InputDecoration(labelText: 'Repo (kullanici/repo)')),
                        ]),
                        actions: [
                          TextButton(
                              onPressed: () {
                                sp.setString('ght', t.text.trim());
                                sp.setString('ghr', r.text.trim());
                                Navigator.pop(c);
                              },
                              child: const Text('Kaydet'))
                        ],
                      ));
            }
          
            @override
            Widget build(BuildContext context) => Scaffold(
                  appBar: AppBar(
                    title: const Row(children: [MarkLogo(size: 30), SizedBox(width: 10), Text('Mark.Dev')]),
                    actions: [IconButton(tooltip: 'GitHub', icon: const Icon(Icons.hub), onPressed: gh)],
                  ),
                  floatingActionButton: FloatingActionButton.extended(onPressed: newChat, icon: const Icon(Icons.add), label: const Text('Yeni sohbet')),
                  body: chats.isEmpty
                      ? const Center(
                          child: Column(mainAxisSize: MainAxisSize.min, children: [
                          MarkLogo(size: 110),
                          SizedBox(height: 18),
                          Text('Henuz sohbet yok', style: TextStyle(fontSize: 18, fontWeight: FontWeight.w600)),
                          SizedBox(height: 6),
                          Text('Asagidan yeni sohbet baslat', style: TextStyle(color: Colors.white54)),
                        ]))
                      : ListView(
                          padding: const EdgeInsets.only(bottom: 90),
                          children: chats.reversed
                              .map((c) => ListTile(
                                    leading: CircleAvatar(
                                        backgroundColor: c.mode == 'Kod' ? Colors.deepPurple : Colors.teal,
                                        child: Icon(c.mode == 'Kod' ? Icons.code : Icons.chat_bubble_outline, color: Colors.white)),
                                    title: Text(c.title),
                                    subtitle: Text('${c.mode} - ${c.msgs.length} mesaj'),
                                    trailing: PopupMenuButton<String>(
                                        onSelected: (v) => v == 'r' ? rename(c) : del(c),
                                        itemBuilder: (_) => const [
                                              PopupMenuItem(value: 'r', child: Text('Yeniden adlandir')),
                                              PopupMenuItem(value: 'd', child: Text('Sil')),
                                            ]),
                                    onTap: () async {
                                      await Navigator.push(context, MaterialPageRoute(builder: (_) => ChatPage(c, chats)));
                                      setState(() {});
                                    },
                                  ))
                              .toList()),
                );
          }
          
          // ---------- KURULUM ----------
          class Setup extends StatefulWidget {
            final String mode;
            final Chat? prev;
            const Setup(this.mode, this.prev, {super.key});
            @override
            State<Setup> createState() => _SetupS();
          }
          
          class _SetupS extends State<Setup> {
            late List<Api> a = widget.prev == null ? [Api.empty(), Api.empty(), Api.empty()] : widget.prev!.apis.map((e) => Api(e.p, e.url, e.model, '')).toList();
            @override
            Widget build(BuildContext context) {
              final ok = a.any((e) => e.key.isNotEmpty);
              return Scaffold(
                appBar: AppBar(title: Text('Mark ${widget.mode} - API ayarlari')),
                body: ListView(children: [
                  for (var i = 0; i < 3; i++)
                    ListTile(
                      title: Text('API ${i + 1} - ${['Guclu', 'Orta', 'Hizli'][i]} isciler'),
                      subtitle: Text('${a[i].p} / ${a[i].model} / ${a[i].key.isEmpty ? 'anahtar yok' : 'hazir'}'),
                      trailing: const Icon(Icons.edit),
                      onTap: () async {
                        final r = await editApi(context, a[i]);
                        if (r != null) setState(() => a[i] = r);
                      },
                    ),
                  Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 16),
                      child: TextButton.icon(
                          onPressed: a[0].key.isEmpty
                              ? null
                              : () => setState(() {
                                    for (var i = 1; i < 3; i++) {
                                      a[i] = Api(a[0].p, a[0].url, a[0].model, a[0].key);
                                    }
                                  }),
                          icon: const Icon(Icons.copy_all),
                          label: const Text("API 1'i digerlerine kopyala"))),
                  Padding(
                      padding: const EdgeInsets.all(16),
                      child: FilledButton(
                          onPressed: ok ? () => Navigator.pop(context, Chat(DateTime.now().millisecondsSinceEpoch.toString(), 'Sohbet ${DateTime.now().hour}:${DateTime.now().minute.toString().padLeft(2, '0')}', widget.mode, a, [false, false, false], [])) : null,
                          child: const Text('Basla'))),
                ]),
              );
            }
          }
          
          // ---------- SOHBET ----------
          class ChatPage extends StatefulWidget {
            final Chat chat;
            final List<Chat> all;
            const ChatPage(this.chat, this.all, {super.key});
            @override
            State<ChatPage> createState() => _ChatS();
          }
          
          class _ChatS extends State<ChatPage> {
            final ctrl = TextEditingController(), sc = ScrollController();
            bool busy = false;
            int? active;
            int? forced;
            Chat get chat => widget.chat;
          
            @override
            void dispose() {
              ctrl.dispose();
              sc.dispose();
              super.dispose();
            }
          
            void toast(String s) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(s)));
            }
          
            void add(Msg m) {
              if (mounted) {
                setState(() => chat.msgs.add(m));
              } else {
                chat.msgs.add(m);
              }
              saveChats(widget.all);
              WidgetsBinding.instance.addPostFrameCallback((_) {
                if (sc.hasClients) sc.animateTo(sc.position.maxScrollExtent, duration: const Duration(milliseconds: 250), curve: Curves.easeOut);
              });
            }
          
            W route(String t) {
              final l = t.toLowerCase();
              int tier;
              if (chat.mode == 'Kod' || t.length > 500 || RegExp(r'kod|code|hata|bug|apk|yml|derle|script|mimari|algoritma|exe|iso').hasMatch(l)) {
                tier = 0;
              } else if (RegExp(r'tasar|ui|test|api|oyun|analiz|arastir|veri').hasMatch(l)) {
                tier = 1;
              } else {
                tier = 2;
              }
              final p = workers.where((w) => w.t == tier).toList();
              return p[t.length % p.length];
            }
          
            List hist(W w) {
              final s = 'Sen ${w.n}, Mark.Dev ekibinde ${w.r} uzmanisin. Kullanici Turkce konusur, Turkce yanit ver. Pes etme, "imkansiz" deme, cozum uret. Ekip: ${workers.map((e) => e.n).join(", ")}. Baska isci gerekirse yanitin ilk satiri sadece "DEVRET: Isim" olsun.${chat.mode == 'Kod' ? ' Dosya uretirken her dosyayi ```file:yol/ad.uzanti satiriyla baslayan blokta TAM icerikle ver ve ``` ile kapat. Kod parcalarini her zaman markdown kod blogu icinde ver.' : ''}';
              final h = chat.msgs.where((m) => m.role != 'note').toList();
              final last = h.length > 20 ? h.sublist(h.length - 20) : h;
              return [
                {'role': 'system', 'content': s},
                ...last.map((m) => {'role': m.role, 'content': m.text})
              ];
            }
          
            Future<String?> call(W w) async {
              for (final i in [w.t, (w.t + 1) % 3, (w.t + 2) % 3]) {
                if (chat.ex[i] || chat.apis[i].key.isEmpty) continue;
                try {
                  return await ask(chat.apis[i], hist(w));
                } on Exhausted catch (e) {
                  chat.ex[i] = true;
                  add(Msg('note', 'API ${i + 1} bitti/reddedildi (HTTP ${e.code}). Ustteki cipe dokunup yeni API ekle.'));
                } catch (e) {
                  add(Msg('note', 'Hata: $e'));
                  return null;
                }
              }
              add(Msg('note', "Tum API'ler bitti. Yeni API ekle ya da limit sifirlanmasini bekle."));
              return null;
            }
          
            Future<void> send() async {
              final t = ctrl.text.trim();
              if (t.isEmpty || busy) return;
              ctrl.clear();
              add(Msg('user', t));
              setState(() => busy = true);
              var w = forced != null ? workers[forced!] : route(t);
              var d = 0;
              while (true) {
                if (mounted) setState(() => active = workers.indexOf(w));
                final r = await call(w);
                if (r == null) break;
                final m = RegExp(r'^DEVRET:\s*(\S+)').firstMatch(r.trim());
                final nw = m == null ? null : workers.where((x) => x.n.toLowerCase() == m.group(1)!.toLowerCase()).firstOrNull;
                if (nw != null && d < 2) {
                  add(Msg('note', '${w.n} -> ${nw.n} devretti'));
                  w = nw;
                  d++;
                  continue;
                }
                add(Msg('assistant', r, '${w.n} (${w.r})'));
                break;
              }
              if (mounted) {
                setState(() {
                  busy = false;
                  active = null;
                });
              }
            }
          
            Future<void> save(String n, String t) async {
              final d = await getExternalStorageDirectory() ?? await getApplicationDocumentsDirectory();
              final f = File('${d.path}/${n.split('/').last}');
              await f.writeAsString(t);
              toast('Kaydedildi: ${f.path}');
            }
          
            Future<void> push(String n, String c) async {
              final tk = sp.getString('ght') ?? '', rp = sp.getString('ghr') ?? '';
              if (tk.isEmpty || rp.isEmpty) {
                toast('Ana ekrandan (hub simgesi) GitHub bagla');
                return;
              }
              toast('Gonderiliyor...');
              toast(await ghPush(tk, rp, n, c));
            }
          
            Future<void> run(String n) async {
              final tk = sp.getString('ght') ?? '', rp = sp.getString('ghr') ?? '';
              if (tk.isEmpty || rp.isEmpty) {
                toast('Ana ekrandan (hub simgesi) GitHub bagla');
                return;
              }
              toast('Baslatiliyor...');
              toast(await ghRun(tk, rp, n.split('/').last));
            }
          
            Widget codeBox(String lang, String code) => Container(
                  width: double.infinity,
                  margin: const EdgeInsets.symmetric(vertical: 6),
                  decoration: BoxDecoration(color: const Color(0xFF0B0B14), borderRadius: BorderRadius.circular(10), border: Border.all(color: Colors.white12)),
                  child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                    Row(children: [
                      Padding(padding: const EdgeInsets.only(left: 10), child: Text(lang.isEmpty ? 'kod' : lang, style: const TextStyle(fontSize: 11, color: Colors.white54))),
                      const Spacer(),
                      IconButton(
                          visualDensity: VisualDensity.compact,
                          icon: const Icon(Icons.copy, size: 16),
                          onPressed: () {
                            Clipboard.setData(ClipboardData(text: code));
                            toast('Kopyalandi');
                          }),
                    ]),
                    SingleChildScrollView(scrollDirection: Axis.horizontal, padding: const EdgeInsets.fromLTRB(10, 0, 10, 10), child: SelectableText(code, style: mono)),
                  ]),
                );
          
            Widget fileCard(String n, String c) {
              final wf = n.startsWith('.github/workflows/') && (n.endsWith('.yml') || n.endsWith('.yaml'));
              return Card(
                margin: const EdgeInsets.symmetric(vertical: 6),
                child: ExpansionTile(
                  leading: Icon(wf ? Icons.play_circle_outline : Icons.insert_drive_file, color: teal),
                  title: Text(n, style: const TextStyle(fontSize: 13)),
                  subtitle: Text('${c.split('\n').length} satir', style: const TextStyle(fontSize: 11)),
                  children: [
                    Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 10),
                        child: Align(alignment: Alignment.centerLeft, child: SingleChildScrollView(scrollDirection: Axis.horizontal, child: SelectableText(c, style: mono)))),
                    OverflowBar(alignment: MainAxisAlignment.end, children: [
                      TextButton.icon(
                          icon: const Icon(Icons.copy, size: 16),
                          label: const Text('Kopyala'),
                          onPressed: () {
                            Clipboard.setData(ClipboardData(text: c));
                            toast('Kopyalandi');
                          }),
                      TextButton.icon(icon: const Icon(Icons.download, size: 16), label: const Text('Kaydet'), onPressed: () => save(n, c)),
                      TextButton.icon(icon: const Icon(Icons.cloud_upload, size: 16), label: const Text('GitHub'), onPressed: () => push(n, c)),
                      if (wf) FilledButton.icon(icon: const Icon(Icons.play_arrow, size: 18), label: const Text('Baslat'), onPressed: () => run(n)),
                    ]),
                  ],
                ),
              );
            }
          
            Widget rich(String text) {
              final re = RegExp(r'```([^\n]*)\n([\s\S]*?)```');
              final out = <Widget>[];
              var pos = 0;
              for (final m in re.allMatches(text)) {
                final before = text.substring(pos, m.start).trim();
                if (before.isNotEmpty) out.add(SelectableText(before));
                final head = m.group(1)!.trim(), code = m.group(2)!;
                out.add(head.startsWith('file:') ? fileCard(head.substring(5).trim(), code) : codeBox(head, code));
                pos = m.end;
              }
              final rest = text.substring(pos).trim();
              if (rest.isNotEmpty) out.add(SelectableText(rest));
              return Column(crossAxisAlignment: CrossAxisAlignment.start, children: out);
            }
          
            Widget bubble(Msg m) {
              if (m.role == 'note') {
                return Padding(padding: const EdgeInsets.all(6), child: Text(m.text, textAlign: TextAlign.center, style: const TextStyle(color: Colors.amber, fontStyle: FontStyle.italic)));
              }
              final me = m.role == 'user';
              return Align(
                  alignment: me ? Alignment.centerRight : Alignment.centerLeft,
                  child: Container(
                      margin: const EdgeInsets.symmetric(vertical: 4),
                      padding: const EdgeInsets.all(10),
                      constraints: BoxConstraints(maxWidth: MediaQuery.of(context).size.width * 0.88),
                      decoration: BoxDecoration(
                          gradient: me ? const LinearGradient(colors: [Color(0xFF5E35B1), Color(0xFF4527A0)]) : null,
                          color: me ? null : const Color(0xFF1A1A28),
                          borderRadius: BorderRadius.circular(14)),
                      child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                        if (m.w.isNotEmpty) Text(m.w, style: const TextStyle(fontSize: 11, color: teal)),
                        me ? SelectableText(m.text) : rich(m.text),
                      ])));
            }
          
            Widget empty() {
              final sug = chat.mode == 'Kod'
                  ? ['Flutter ile not defteri uygulamasi yaz', 'GitHub Actions ile APK derleyen yml yaz', 'Python ile hesap makinesi scripti yaz']
                  : ['Bana bugun icin bir plan yap', 'Bir fikir uret: yeni uygulama', 'Ingilizce ceviri yap: merhaba dunya'];
              return Padding(
                  padding: const EdgeInsets.only(top: 40),
                  child: Column(children: [
                    const MarkLogo(size: 90),
                    const SizedBox(height: 16),
                    const Text('Ne yapalim?', style: TextStyle(fontSize: 18, fontWeight: FontWeight.w600)),
                    const SizedBox(height: 12),
                    Wrap(spacing: 8, runSpacing: 8, alignment: WrapAlignment.center, children: [
                      for (final s in sug)
                        ActionChip(
                            label: Text(s, style: const TextStyle(fontSize: 12)),
                            onPressed: () => ctrl.value = TextEditingValue(text: s, selection: TextSelection.collapsed(offset: s.length))),
                    ]),
                  ]));
            }
          
            @override
            Widget build(BuildContext context) {
              final tok = chat.msgs.fold<int>(0, (s, m) => s + m.text.length) ~/ 4;
              return Scaffold(
                appBar: AppBar(
                  title: Row(children: [const MarkLogo(size: 28), const SizedBox(width: 10), Text('Mark ${chat.mode}')]),
                  actions: [
                    Center(child: Text('~$tok tk', style: const TextStyle(color: Colors.white54, fontSize: 12))),
                    PopupMenuButton<String>(
                        onSelected: (v) {
                          if (v == 'c') {
                            setState(() => chat.msgs.clear());
                            saveChats(widget.all);
                          } else {
                            final all = chat.msgs.map((m) => '${m.role == 'user' ? 'Ben' : m.w}: ${m.text}').join('\n\n');
                            Clipboard.setData(ClipboardData(text: all));
                            toast('Konusma kopyalandi');
                          }
                        },
                        itemBuilder: (_) => const [
                              PopupMenuItem(value: 'c', child: Text('Sohbeti temizle')),
                              PopupMenuItem(value: 'k', child: Text('Konusmayi kopyala')),
                            ]),
                  ],
                ),
                body: Column(children: [
                  SizedBox(
                      height: 70,
                      child: ListView(scrollDirection: Axis.horizontal, children: [
                        for (var i = 0; i < workers.length; i++)
                          GestureDetector(
                              onTap: () => setState(() => forced = forced == i ? null : i),
                              child: Padding(
                                  padding: const EdgeInsets.symmetric(horizontal: 4),
                                  child: AnimatedScale(
                                      scale: active == i ? 1.25 : 1,
                                      duration: const Duration(milliseconds: 300),
                                      child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                                        Container(
                                            padding: const EdgeInsets.all(2),
                                            decoration: BoxDecoration(shape: BoxShape.circle, border: forced == i ? Border.all(color: teal, width: 2) : null),
                                            child: CircleAvatar(radius: 14, backgroundColor: tierColors[workers[i].t].withAlpha(active == i ? 255 : 130), child: Text(workers[i].n[0]))),
                                        Text(workers[i].n, style: const TextStyle(fontSize: 9)),
                                      ])))),
                      ])),
                  Row(mainAxisAlignment: MainAxisAlignment.center, children: [
                    for (var i = 0; i < 3; i++)
                      Padding(
                          padding: const EdgeInsets.all(4),
                          child: ActionChip(
                              backgroundColor: chat.ex[i] ? Colors.red.shade900 : Colors.green.shade900,
                              label: Text('API ${i + 1}'),
                              onPressed: () async {
                                final r = await editApi(context, chat.apis[i]);
                                if (r != null) {
                                  setState(() {
                                    chat.apis[i] = r;
                                    chat.ex[i] = false;
                                  });
                                  saveChats(widget.all);
                                }
                              })),
                  ]),
                  Expanded(
                      child: ListView(controller: sc, padding: const EdgeInsets.all(8), children: [
                    if (chat.msgs.isEmpty) empty(),
                    for (final m in chat.msgs) bubble(m),
                    if (busy)
                      Padding(
                          padding: const EdgeInsets.all(8),
                          child: Column(children: [
                            const LinearProgressIndicator(),
                            const SizedBox(height: 4),
                            Text(active == null ? '' : '${workers[active!].n} yaziyor...', style: const TextStyle(fontSize: 11, color: Colors.white54)),
                          ])),
                  ])),
                  SafeArea(
                      child: Padding(
                          padding: const EdgeInsets.all(8),
                          child: Row(children: [
                            Expanded(
                                child: TextField(
                                    controller: ctrl,
                                    minLines: 1,
                                    maxLines: 5,
                                    decoration: InputDecoration(
                                        hintText: forced == null ? 'Mark ekibine yaz...' : '${workers[forced!].n} ile konus...',
                                        border: const OutlineInputBorder()))),
                            IconButton(icon: const Icon(Icons.send, color: teal), onPressed: busy ? null : send),
                          ]))),
                ]),
              );
            }
          }
