name: Build EldeVar APK

# EldeVar: telefonda gercek Windows 10 (QEMU sanal makine)
# Taban: Vectras VM (acik kaynak). Bu yml: kaynagi ceker, adini EldeVar yapar,
# logoyu kendisi cizer, debug APK uretir.
# Kullanim: bu dosyayi reponun .github/workflows/EldeVar.yml yoluna koy,
# Actions sekmesinden "Build EldeVar APK" calistir, APK'yi Artifacts'tan indir.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/EldeVar.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Vectras VM kaynagini cek
        run: |
          git clone --depth 1 https://github.com/xoureldeen/Vectras-VM-Android.git src
          cd src
          git submodule update --init --recursive || true
          ls -la

      - name: Uygulama modulunu bul
        run: |
          cd src
          echo "--- Bulunan manifestler ---"
          find . -name AndroidManifest.xml -not -path '*/build/*' -not -path '*/node_modules/*'
          MANIFEST=$(grep -rl 'android.intent.category.LAUNCHER' --include=AndroidManifest.xml . 2>/dev/null | grep -v '/build/' | head -n1 || true)
          for m in $(find . -name AndroidManifest.xml -path '*/src/main/*' -not -path '*/build/*'); do
            [ -n "$MANIFEST" ] && break
            MOD=$(dirname "$(dirname "$(dirname "$m")")")
            if grep -qs 'android.application' "$MOD"/build.gradle "$MOD"/build.gradle.kts; then
              MANIFEST="$m"
              break
            fi
          done
          if [ -z "$MANIFEST" ]; then
            MANIFEST=$(find . -name AndroidManifest.xml -path '*/src/main/*' -not -path '*/build/*' | head -n1)
          fi
          if [ -z "$MANIFEST" ]; then
            echo "HATA: AndroidManifest.xml bulunamadi"
            exit 1
          fi
          MOD=$(dirname "$(dirname "$(dirname "$MANIFEST")")")
          APP=$(cd "$MOD" && pwd)
          echo "APP_DIR=$APP" >> $GITHUB_ENV
          echo "Manifest: $MANIFEST"
          echo "Modul: $APP"
          ls "$APP/src/main"

      - name: EldeVar logosunu ciz
        run: |
          pip install pillow
          cat > logo.py <<'PY'
          import os, sys
          from PIL import Image, ImageDraw, ImageFilter

          S = 1024
          def lerp(a, b, t): return int(a + (b - a) * t)

          # Arka plan: koyu mavi -> turkuaz capraz gecis
          bg = Image.new("RGB", (S, S))
          px = bg.load()
          c1, c2 = (10, 25, 70), (0, 190, 220)
          for y in range(S):
              for x in range(S):
                  t = (x + y) / (2 * S)
                  px[x, y] = (lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t))

          # Parlama
          glow = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          gd = ImageDraw.Draw(glow)
          gd.ellipse((S*0.15, S*0.10, S*0.85, S*0.80), fill=(120, 230, 255, 90))
          glow = glow.filter(ImageFilter.GaussianBlur(90))
          bg = Image.alpha_composite(bg.convert("RGBA"), glow)

          d = ImageDraw.Draw(bg)

          # Telefon govdesi (ince cerceve)
          pw, ph = S*0.50, S*0.78
          px0, py0 = (S - pw) / 2, (S - ph) / 2
          d.rounded_rectangle((px0, py0, px0 + pw, py0 + ph), radius=90,
                              outline=(255, 255, 255, 235), width=26)

          # Windows tarzi 4 pencere
          cx, cy = S / 2, S / 2 - 10
          g, s = 18, 150
          cols = [(255, 255, 255), (255, 255, 255), (255, 255, 255), (255, 196, 0)]
          boxes = [
              (cx - g/2 - s, cy - g/2 - s, cx - g/2, cy - g/2),
              (cx + g/2, cy - g/2 - s, cx + g/2 + s, cy - g/2),
              (cx - g/2 - s, cy + g/2, cx - g/2, cy + g/2 + s),
              (cx + g/2, cy + g/2, cx + g/2 + s, cy + g/2 + s),
          ]
          for b, c in zip(boxes, cols):
              d.rounded_rectangle(b, radius=22, fill=c + (255,))

          # Alt cubuk (kamera/ana ekran cizgisi)
          d.rounded_rectangle((S/2 - 70, py0 + ph - 60, S/2 + 70, py0 + ph - 42),
                              radius=9, fill=(255, 255, 255, 220))

          # Koseleri yuvarlak kare ikon
          mask = Image.new("L", (S, S), 0)
          ImageDraw.Draw(mask).rounded_rectangle((0, 0, S, S), radius=230, fill=255)
          square = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          square.paste(bg, (0, 0), mask)

          # Daire ikon
          cmask = Image.new("L", (S, S), 0)
          ImageDraw.Draw(cmask).ellipse((0, 0, S, S), fill=255)
          circle = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          circle.paste(bg, (0, 0), cmask)

          os.makedirs("logo_out", exist_ok=True)
          square.resize((512, 512), Image.LANCZOS).save("logo_out/EldeVar_logo_512.png")

          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          app = os.environ["APP_DIR"]
          res = os.path.join(app, "src", "main", "res")
          for dens, px_ in sizes.items():
              folder = os.path.join(res, "mipmap-" + dens)
              os.makedirs(folder, exist_ok=True)
              square.resize((px_, px_), Image.LANCZOS).save(os.path.join(folder, "ic_launcher.png"))
              circle.resize((px_, px_), Image.LANCZOS).save(os.path.join(folder, "ic_launcher_round.png"))
              for n in ("ic_launcher_foreground.png",):
                  square.resize((px_, px_), Image.LANCZOS).save(os.path.join(folder, n))

          # Adaptive icon xml'leri PNG'leri ezmesin
          for root, dirs, files in os.walk(res):
              if "anydpi" in root:
                  for f in files:
                      if f.startswith("ic_launcher") and f.endswith(".xml"):
                          os.remove(os.path.join(root, f))
                          print("silindi:", os.path.join(root, f))
          print("Logo hazir")
          PY
          python3 logo.py

      - name: Adi EldeVar yap
        run: |
          cd "$APP_DIR/src/main/res"
          for f in $(find . -name strings.xml); do
            sed -i -E 's|(<string name="app_name"[^>]*>)[^<]*(</string>)|\1EldeVar\2|' "$f"
          done
          grep -rn 'name="app_name"' . | head
          # Manifest'te sabit etiket varsa onu da degistir
          sed -i -E 's|android:label="[^@"][^"]*"|android:label="EldeVar"|' "$APP_DIR/src/main/AndroidManifest.xml" || true

      - name: Yerlesik tarayici ekle (her sayfayi acan)
        run: |
          JDIR="$APP_DIR/src/main/java/com/eldevar/browser"
          mkdir -p "$JDIR"
          cat > "$JDIR/BrowserActivity.java" <<'JAVA'
          package com.eldevar.browser;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.DownloadManager;
          import android.content.DialogInterface;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.net.http.SslError;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.inputmethod.EditorInfo;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.SslErrorHandler;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;

          public class BrowserActivity extends Activity {
              private static final int FILE_REQ = 7;
              private static final String DESKTOP_UA =
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                  + "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";

              private WebView web;
              private EditText urlBox;
              private ProgressBar bar;
              private FrameLayout root;
              private View customView;
              private WebChromeClient.CustomViewCallback customCb;
              private ValueCallback<Uri[]> fileCb;
              private String defaultUA;
              private boolean desktop = false;

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private Button btn(String t, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(t);
                  b.setAllCaps(false);
                  b.setMinWidth(0);
                  b.setMinimumWidth(0);
                  b.setPadding(dp(10), 0, dp(10), 0);
                  b.setOnClickListener(l);
                  return b;
              }

              private String fix(String in) {
                  String s = in.trim();
                  if (s.isEmpty()) return "https://www.google.com";
                  if (s.startsWith("http://") || s.startsWith("https://")
                      || s.startsWith("file://") || s.startsWith("about:")) return s;
                  if (!s.contains(" ") && s.contains(".")) return "https://" + s;
                  return "https://www.google.com/search?q=" + Uri.encode(s);
              }

              private void go() {
                  web.loadUrl(fix(urlBox.getText().toString()));
                  web.requestFocus();
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  root = new FrameLayout(this);
                  LinearLayout main = new LinearLayout(this);
                  main.setOrientation(LinearLayout.VERTICAL);
                  main.setFitsSystemWindows(true);

                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.HORIZONTAL);
                  top.setPadding(dp(4), dp(4), dp(4), dp(4));

                  urlBox = new EditText(this);
                  urlBox.setSingleLine(true);
                  urlBox.setSelectAllOnFocus(true);
                  urlBox.setImeOptions(EditorInfo.IME_ACTION_GO);
                  urlBox.setHint("Adres ya da arama");
                  urlBox.setInputType(android.text.InputType.TYPE_CLASS_TEXT
                      | android.text.InputType.TYPE_TEXT_VARIATION_URI);
                  urlBox.setOnEditorActionListener(new TextView.OnEditorActionListener() {
                      @Override
                      public boolean onEditorAction(TextView v, int id, KeyEvent e) {
                          go();
                          return true;
                      }
                  });

                  top.addView(btn("<", new View.OnClickListener() {
                      public void onClick(View v) { if (web.canGoBack()) web.goBack(); }
                  }));
                  top.addView(btn(">", new View.OnClickListener() {
                      public void onClick(View v) { if (web.canGoForward()) web.goForward(); }
                  }));
                  top.addView(btn("R", new View.OnClickListener() {
                      public void onClick(View v) { web.reload(); }
                  }));
                  top.addView(urlBox, new LinearLayout.LayoutParams(0,
                      ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                  final Button deskBtn = btn("PC", null);
                  deskBtn.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          desktop = !desktop;
                          web.getSettings().setUserAgentString(desktop ? DESKTOP_UA : defaultUA);
                          web.getSettings().setUseWideViewPort(true);
                          web.getSettings().setLoadWithOverviewMode(desktop);
                          deskBtn.setText(desktop ? "PC*" : "PC");
                          web.reload();
                      }
                  });
                  top.addView(deskBtn);
                  top.addView(btn("Git", new View.OnClickListener() {
                      public void onClick(View v) { go(); }
                  }));

                  bar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  bar.setMax(100);

                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  defaultUA = s.getUserAgentString();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setSupportZoom(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setSupportMultipleWindows(false);
                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String u = r.getUrl().toString();
                          if (u.startsWith("http://") || u.startsWith("https://")
                              || u.startsWith("file://") || u.startsWith("about:")) return false;
                          try {
                              Intent i = u.startsWith("intent:")
                                  ? Intent.parseUri(u, Intent.URI_INTENT_SCHEME)
                                  : new Intent(Intent.ACTION_VIEW, Uri.parse(u));
                              startActivity(i);
                          } catch (Exception e) {
                              Toast.makeText(BrowserActivity.this,
                                  "Bu baglanti acilamadi", Toast.LENGTH_SHORT).show();
                          }
                          return true;
                      }

                      @Override
                      public void onPageStarted(WebView v, String u, Bitmap f) {
                          urlBox.setText(u);
                      }

                      @Override
                      public void onPageFinished(WebView v, String u) {
                          urlBox.setText(u);
                      }

                      @Override
                      public void onReceivedSslError(WebView v, final SslErrorHandler h, SslError e) {
                          new AlertDialog.Builder(BrowserActivity.this)
                              .setTitle("Guvenlik uyarisi")
                              .setMessage("Bu sitenin sertifikasi gecersiz. Yine de devam edilsin mi?")
                              .setPositiveButton("Devam", new DialogInterface.OnClickListener() {
                                  public void onClick(DialogInterface d, int w) { h.proceed(); }
                              })
                              .setNegativeButton("Iptal", new DialogInterface.OnClickListener() {
                                  public void onClick(DialogInterface d, int w) { h.cancel(); }
                              })
                              .show();
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView v, int p) {
                          bar.setProgress(p);
                          bar.setVisibility(p >= 100 ? View.GONE : View.VISIBLE);
                      }

                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb,
                                                       FileChooserParams params) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          try {
                              startActivityForResult(params.createIntent(), FILE_REQ);
                          } catch (Exception e) {
                              fileCb = null;
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onShowCustomView(View view, CustomViewCallback cb) {
                          if (customView != null) { cb.onCustomViewHidden(); return; }
                          customView = view;
                          customCb = cb;
                          root.addView(view, new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT));
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          root.removeView(customView);
                          customView = null;
                          if (customCb != null) customCb.onCustomViewHidden();
                      }
                  });

                  web.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String u, String ua, String cd,
                                                  String mime, long len) {
                          try {
                              DownloadManager.Request r = new DownloadManager.Request(Uri.parse(u));
                              r.setMimeType(mime);
                              String ck = CookieManager.getInstance().getCookie(u);
                              if (ck != null) r.addRequestHeader("cookie", ck);
                              r.addRequestHeader("User-Agent", ua);
                              r.setNotificationVisibility(
                                  DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                              r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS,
                                  URLUtil.guessFileName(u, cd, mime));
                              ((DownloadManager) getSystemService(DOWNLOAD_SERVICE)).enqueue(r);
                              Toast.makeText(BrowserActivity.this,
                                  "Indirme basladi (Downloads klasorune)", Toast.LENGTH_SHORT).show();
                          } catch (Exception e) {
                              Toast.makeText(BrowserActivity.this,
                                  "Indirme baslatilamadi", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });

                  main.addView(top);
                  main.addView(bar, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(3)));
                  main.addView(web, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  root.addView(main, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  Uri data = getIntent() != null ? getIntent().getData() : null;
                  web.loadUrl(data != null ? data.toString() : "https://www.google.com");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == FILE_REQ && fileCb != null) {
                      fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      fileCb = null;
                  } else {
                      super.onActivityResult(req, res, data);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      web.getWebChromeClient().onHideCustomView();
                  } else if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          JAVA

          python3 - <<'PY'
          import os, re
          p = os.path.join(os.environ["APP_DIR"], "src", "main", "AndroidManifest.xml")
          s = open(p, encoding="utf-8").read()
          print("Manifest yolu:", p)
          if "</application>" not in s:
              print("HATA: bu manifestte </application> yok, yanlis modul olabilir")
              print(s[:1500])
              raise SystemExit(1)
          if "com.eldevar.browser.BrowserActivity" not in s:
              if "android.permission.INTERNET" not in s:
                  perm = '<uses-permission android:name="android.permission.INTERNET"/>\n    '
                  s = re.sub(r"<application", lambda m: perm + "<application", s, count=1)
              if "usesCleartextTraffic" not in s:
                  s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
              act = (
                  '    <activity android:name="com.eldevar.browser.BrowserActivity"\n'
                  '        android:label="EldeVar Tarayici"\n'
                  '        android:icon="@mipmap/ic_launcher"\n'
                  '        android:exported="true"\n'
                  '        android:windowSoftInputMode="adjustResize"\n'
                  '        android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.intent.action.MAIN"/>\n'
                  '            <category android:name="android.intent.category.LAUNCHER"/>\n'
                  '        </intent-filter>\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.intent.action.VIEW"/>\n'
                  '            <category android:name="android.intent.category.DEFAULT"/>\n'
                  '            <category android:name="android.intent.category.BROWSABLE"/>\n'
                  '            <data android:scheme="http"/>\n'
                  '            <data android:scheme="https"/>\n'
                  '        </intent-filter>\n'
                  '    </activity>\n'
              )
              s = s.replace("</application>", act + "</application>", 1)
              open(p, "w", encoding="utf-8").write(s)
          print("Tarayici manifeste eklendi")
          PY
          grep -n "BrowserActivity\|INTERNET\|usesCleartext" "$APP_DIR/src/main/AndroidManifest.xml" || { echo "Uyari: eslesme yok, manifest:"; head -n 60 "$APP_DIR/src/main/AndroidManifest.xml"; }

      - name: APK derle
        run: |
          cd src
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yi bul ve adlandir
        run: |
          mkdir -p out
          find src -name "*.apk" -path "*debug*" -exec cp {} out/ \;
          cd out
          i=0
          for f in *.apk; do
            i=$((i+1))
            mv "$f" "EldeVar-$i.apk" 2>/dev/null || true
          done
          ls -la

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: EldeVar-APK
          path: out/*.apk

      - name: Logoyu yukle
        uses: actions/upload-artifact@v4
        with:
          name: EldeVar-Logo
          path: logo_out/*.png
